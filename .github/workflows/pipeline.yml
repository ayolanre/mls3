name: Week 3 MLS CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- JOB 1: Register Dataset ----------
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r week_3_mls/requirements.txt

      - name: Register dataset
        run: python week_3_mls/model_building/data_register.py

      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: week_3_mls/data/machine-failure-prediction.csv

  # ---------- JOB 2: Data Preparation ----------
  data-preparation:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r week_3_mls/requirements.txt

      - name: Prepare data
        run: python week_3_mls/model_building/prep.py

      - name: Upload train/test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  # ---------- JOB 3: Model Training ----------
  model-training:
    name: Model Training
    needs: data-preparation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r week_3_mls/requirements.txt

      - name: Download train/test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits

      - name: Train model with MLflow tracking
        run: python week_3_mls/model_building/train.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes safely
        run: git pull origin main --rebase

      - name: Commit trained model
        run: |
          git add week_3_mls/deployment/best_machine_failure_model_v1.joblib
          git diff --cached --quiet || git commit -m "Add trained model [skip ci]"

      - name: Push changes
        run: git push origin main
